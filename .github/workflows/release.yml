name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - name: Set manifest version from tag
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
      - run: npm run pack
      - name: Attach zip to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release created in the GitHub UI already exists when this runs.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" leetcode-picker.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" leetcode-picker.zip --verify-tag --generate-notes
          fi
