<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LeetCode Picker</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <form id="filters">
    <header class="top">
      <img src="../icons/48.png" alt="" width="22" height="22">
      <h1>LeetCode Picker</h1>
      <div class="seg mode" role="radiogroup" aria-label="Search by">
        <label><input type="radio" name="mode" value="rating" checked>Rating</label>
        <label><input type="radio" name="mode" value="difficulty">Difficulty</label>
      </div>
    </header>

    <section class="panel rating-panel">
      <div class="panel-head">
        <span class="eyebrow">Rating</span>
        <output id="ratingLabel"></output>
      </div>
      <div id="hist" aria-hidden="true"></div>
      <div class="range" id="range">
        <div class="track"><div class="fill"></div></div>
        <input type="range" name="ratingMin" min="1000" max="3200" step="50" aria-label="Minimum rating">
        <input type="range" name="ratingMax" min="1000" max="3200" step="50" aria-label="Maximum rating">
        <span class="thumb" data-for="ratingMin"></span>
        <span class="thumb" data-for="ratingMax"></span>
      </div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
    </section>

    <section class="panel difficulty-panel">
      <div class="panel-head"><span class="eyebrow">Difficulty</span></div>
      <div class="levels">
        <label class="level" style="--d: var(--easy)">
          <input type="checkbox" name="difficulty" value="Easy">
          <span class="name"><i></i>Easy</span><b data-level="Easy"></b>
        </label>
        <label class="level" style="--d: var(--medium)">
          <input type="checkbox" name="difficulty" value="Medium">
          <span class="name"><i></i>Medium</span><b data-level="Medium"></b>
        </label>
        <label class="level" style="--d: var(--hard)">
          <input type="checkbox" name="difficulty" value="Hard">
          <span class="name"><i></i>Hard</span><b data-level="Hard"></b>
        </label>
      </div>
    </section>

    <section class="more">
      <span class="label">Topics</span>
      <div class="topics">
        <button type="button" id="topicSummary" class="field trigger" popovertarget="topicDrop">Any</button>
        <div id="topicDrop" class="pop drop" popover>
          <input type="search" id="topicSearch" class="field" placeholder="Search topics" autocomplete="off" aria-label="Search topics" autofocus>
          <div id="topicList"></div>
          <button type="button" id="clearTopics" class="link">Clear topics</button>
        </div>
      </div>

      <span class="label">Company</span>
      <div class="controls">
        <div class="combo grow">
          <input name="company" class="field" placeholder="Any" autocomplete="off" spellcheck="false"
                 role="combobox" aria-label="Company" aria-expanded="false" aria-controls="companyMenu" aria-autocomplete="list">
          <ul id="companyMenu" class="pop menu" role="listbox" popover="manual"></ul>
        </div>
        <select name="period" class="field" aria-label="Asked within">
          <option value="30d">30 days</option>
          <option value="3m">3 months</option>
          <option value="6m">6 months</option>
          <option value="older">Older</option>
          <option value="all">All time</option>
        </select>
      </div>

      <span class="label">Status</span>
      <div class="controls">
        <select name="status" class="field grow" aria-label="Solve status">
          <option value="any">Any</option>
          <option value="todo">Not attempted</option>
          <option value="notac">Attempted, not solved</option>
          <option value="unsolved">Not solved</option>
          <option value="ac">Solved</option>
        </select>
        <label class="check"><input type="checkbox" name="paid"> Premium</label>
      </div>

      <span class="label">Likes</span>
      <div class="seg likes" role="radiogroup" aria-label="Minimum likes">
        <label><input type="radio" name="minLikes" value="0" checked>Any</label>
        <label><input type="radio" name="minLikes" value="1000">1k+</label>
        <label><input type="radio" name="minLikes" value="3000">3k+</label>
        <label><input type="radio" name="minLikes" value="5000">5k+</label>
      </div>
    </section>
  </form>

  <footer class="bottom">
    <p id="count" role="status"></p>
    <button type="button" id="pick" class="primary">Pick a problem</button>
  </footer>
</body>
</html>
